{% extends "base.html" %}
{% block title %}Edit Student - Student Management System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Student</h2>
    <a href="{{ url_for('students') }}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to List</a>
</div>

<div class="card mb-4">
    <div class="card-header bg-white">
        <i class="bi bi-pencil-square me-1"></i> Edit Student Details
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" id="firstName" value="{{ student.first_name }}" required>
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" id="lastName" value="{{ student.last_name }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" id="email" value="{{ student.email }}" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" id="phone" value="{{ student.phone or '' }}">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="isActive" class="form-label">Is Active</label>
                    <select name="is_active" id="isActive" class="form-select">
                        <option value="1" {% if student.is_active %}selected{% endif %}>Yes</option>
                        <option value="0" {% if not student.is_active %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea name="address" class="form-control" id="address" rows="3">{{ student.address or '' }}</textarea>
            </div>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('view_student', student_id=student.id) }}" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Update Student</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
