{% extends "base.html" %}
{% block title %}Edit Course - Student Management System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Course</h2>
    <a href="{{ url_for('courses') }}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to List</a>
</div>

<div class="card mb-4">
    <div class="card-header bg-white">
        <i class="bi bi-pencil-square me-1"></i> Edit Course Details
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="courseName" class="form-label">Course Name</label>
                    <input type="text" name="course_name" class="form-control" id="courseName" value="{{ course.course_name }}" required>
                </div>
                <div class="col-md-6">
                    <label for="courseCode" class="form-label">Course Code</label>
                    <input type="text" name="course_code" class="form-control" id="courseCode" value="{{ course.course_code }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="duration" class="form-label">Duration</label>
                    <input type="text" name="duration" class="form-control" id="duration" value="{{ course.duration or '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="courseFee" class="form-label">Course Fee</label>
                    <input type="number" step="0.01" min="0" name="fee" class="form-control" id="courseFee" value="{{ course.fee }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="isActive" class="form-label">Is Active</label>
                    <select name="is_active" id="isActive" class="form-select">
                        <option value="1" {% if course.is_active %}selected{% endif %}>Yes</option>
                        <option value="0" {% if not course.is_active %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea name="description" class="form-control" id="description" rows="4">{{ course.description or '' }}</textarea>
            </div>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('view_course', course_id=course.id) }}" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Update Course</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
