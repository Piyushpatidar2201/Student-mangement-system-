{% extends "base.html" %}
{% block title %}Add Course - Student Management System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add New Course</h2>
    <a href="{{ url_for('courses') }}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to List</a>
</div>

<div class="card mb-4">
    <div class="card-header bg-white">
        <i class="bi bi-plus-circle me-1"></i> Course Details
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="courseName" class="form-label">Course Name</label>
                    <input type="text" name="course_name" class="form-control" id="courseName"
                        placeholder="e.g. Web Development" value="{{ form_data.course_name if form_data else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="courseCode" class="form-label">Course Code</label>
                    <input type="text" name="course_code" class="form-control" id="courseCode" placeholder="e.g. WEB101"
                        value="{{ form_data.course_code if form_data else '' }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="duration" class="form-label">Duration</label>
                    <input type="text" name="duration" class="form-control" id="duration" placeholder="e.g. 6 Months"
                        value="{{ form_data.duration if form_data else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="courseFee" class="form-label">Course Fee</label>
                    <input type="number" step="0.01" min="0" name="fee" class="form-control" id="courseFee" placeholder="e.g. 1200"
                        value="{{ form_data.fee if form_data else '' }}" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea name="description" class="form-control" id="description" rows="4"
                    placeholder="Enter course description...">{{ form_data.description if form_data else '' }}</textarea>
            </div>
            <div class="d-flex justify-content-end">
                <button type="reset" class="btn btn-light me-2">Reset</button>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save Course</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
